<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎃 Confirmă Prezența — Ersi's Party</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0c0816;
            color: #ede6f5;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .bg-img {
            position: fixed; inset: 0;
            background: url('./halloween_bg.jpg') center/cover no-repeat;
            filter: brightness(0.18) saturate(1.2);
        }

        .bg-fade {
            position: fixed; inset: 0;
            background: linear-gradient(180deg, rgba(12,8,22,0.3), rgba(12,8,22,0.85) 60%, rgba(12,8,22,0.97));
        }

        .particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
        .p {
            position: absolute;
            opacity: 0.45;
            animation: drift ease-in-out infinite;
        }
        @keyframes drift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(15px, -20px) rotate(5deg); }
            50% { transform: translate(-10px, -35px) rotate(-3deg); }
            75% { transform: translate(20px, -15px) rotate(7deg); }
        }

        .page {
            position: relative;
            z-index: 1;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(30, 20, 50, 0.7);
            border: 1px solid rgba(255,140,0,0.12);
            border-radius: 24px;
            padding: 2rem;
            backdrop-filter: blur(20px);
        }

        /* Back link */
        .back {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: rgba(237,230,245,0.4);
            text-decoration: none;
            margin-bottom: 1.2rem;
            transition: color 0.2s;
        }
        .back:hover { color: #ffb347; }

        .rsvp-title {
            font-family: 'Creepster', cursive;
            font-size: 1.8rem;
            color: #ff8c00;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .field { margin-bottom: 1rem; }

        .field label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255,179,71,0.6);
            margin-bottom: 0.4rem;
        }

        .field input, .field textarea {
            width: 100%;
            padding: 0.7rem 1rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,140,0,0.12);
            border-radius: 10px;
            color: #ede6f5;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .field input:focus, .field textarea:focus { border-color: rgba(255,140,0,0.4); }
        .field textarea { resize: none; height: 55px; }
        .field input::placeholder, .field textarea::placeholder { color: rgba(237,230,245,0.2); }

        .responses { display: flex; gap: 0.6rem; }

        .resp {
            flex: 1;
            padding: 0.75rem 0.4rem;
            border: 1.5px solid rgba(255,255,255,0.07);
            border-radius: 12px;
            background: transparent;
            color: #ede6f5;
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .resp .re { display: block; font-size: 1.3rem; margin-bottom: 0.2rem; }
        .resp:hover { background: rgba(255,255,255,0.04); }
        .resp[data-r="yes"].on { border-color: #4ade80; background: rgba(74,222,128,0.1); }
        .resp[data-r="maybe"].on { border-color: #fbbf24; background: rgba(251,191,36,0.1); }
        .resp[data-r="no"].on { border-color: #f87171; background: rgba(248,113,113,0.1); }

        .send {
            width: 100%;
            margin-top: 0.8rem;
            padding: 0.8rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff8c00, #e8720c);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(255,140,0,0.25);
        }

        .send:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(255,140,0,0.4); }
        .send:disabled { opacity: 0.35; cursor: default; transform: none; box-shadow: none; }

        /* Done */
        .done { display: none; text-align: center; padding: 1.5rem 0; }
        .done.show { display: block; }
        .done .di { font-size: 3rem; margin-bottom: 0.5rem; animation: pop 0.4s cubic-bezier(0.175,0.885,0.32,1.275); }
        .done h3 { font-family: 'Creepster', cursive; color: #4ade80; font-size: 1.4rem; margin-bottom: 0.3rem; }
        .done p { font-size: 0.85rem; color: rgba(237,230,245,0.5); margin-bottom: 1.2rem; }
        .done a {
            display: inline-flex; align-items: center; gap: 0.3rem;
            color: #ffb347; font-size: 0.85rem; text-decoration: none;
        }
        .done a:hover { text-decoration: underline; }
        form.off { display: none; }

        @keyframes pop {
            0% { transform: scale(0); }
            80% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Guests */
        .guests {
            margin-top: 1.2rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 0.8rem;
        }

        .gt {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255,179,71,0.4);
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .gi {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.4rem 0;
            font-size: 0.82rem;
        }

        .gi + .gi { border-top: 1px solid rgba(255,255,255,0.03); }

        .gb {
            font-size: 0.62rem;
            font-weight: 600;
            padding: 0.15rem 0.45rem;
            border-radius: 20px;
        }

        .gb.yes { background: rgba(74,222,128,0.12); color: #4ade80; }
        .gb.maybe { background: rgba(251,191,36,0.12); color: #fbbf24; }
        .gb.no { background: rgba(248,113,113,0.12); color: #f87171; }

        .ge { text-align: center; font-size: 0.78rem; color: rgba(237,230,245,0.2); padding: 0.3rem 0; }

        @media (max-height: 620px) {
            .card { padding: 1.3rem; }
            .rsvp-title { font-size: 1.5rem; margin-bottom: 1rem; }
            .field { margin-bottom: 0.7rem; }
            .field textarea { height: 40px; }
        }

        @media (max-width: 480px) {
            .responses { flex-direction: column; gap: 0.4rem; }
            .resp { flex-direction: row; display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1rem; }
            .resp .re { display: inline; margin-bottom: 0; }
        }
    </style>
</head>
<body>

<div class="bg-img"></div>
<div class="bg-fade"></div>
<div class="particles" id="particles"></div>

<div class="page">
    <div class="card">
        <a href="index.html" class="back">← Înapoi la invitație</a>

        <h2 class="rsvp-title">🎃 Confirmă Prezența</h2>

        <form id="form">
            <div class="field">
                <label>Numele tău</label>
                <input type="text" id="name" placeholder="Cum te cheamă?" required>
            </div>

            <div class="field">
                <label>Poți veni?</label>
                <div class="responses">
                    <button type="button" class="resp" data-r="yes">
                        <span class="re">🎉</span> Vin!
                    </button>
                    <button type="button" class="resp" data-r="no">
                        <span class="re">😢</span> Nu pot
                    </button>
                </div>
            </div>

            <div class="field">
                <label>Mesaj (opțional)</label>
                <textarea id="msg" placeholder="Ceva de adăugat?"></textarea>
            </div>

            <button type="submit" class="send" id="sendBtn" disabled>Trimite</button>
        </form>

        <div class="done" id="done">
            <div class="di" id="doneIcon">🎉</div>
            <h3 id="doneTitle">Mersi!</h3>
            <p id="doneText">Răspunsul tău a fost salvat.</p>
            <a href="index.html">← Înapoi la invitație</a>
        </div>

        <div class="guests">
            <div class="gt">Răspunsuri</div>
            <div id="gList">
                <div class="ge" id="gE">Fii primul care răspunde 🦇</div>
            </div>
        </div>
    </div>
</div>

<script>
    // Particles
    const box = document.getElementById('particles');
    const emo = ['🎃','👻','🦇','🍂','✨','🌙'];
    for (let i = 0; i < 18; i++) {
        const s = document.createElement('span');
        s.classList.add('p');
        s.textContent = emo[Math.floor(Math.random()*emo.length)];
        s.style.left = Math.random()*100+'%';
        s.style.top = Math.random()*100+'%';
        s.style.fontSize = (0.7+Math.random()*1)+'rem';
        s.style.animationDuration = (4+Math.random()*6)+'s';
        s.style.animationDelay = Math.random()*-6+'s';
        box.appendChild(s);
    }

    // RSVP
    const KEY = 'ersi_rsvps';
    let pick = null;

    document.querySelectorAll('.resp').forEach(b => {
        b.addEventListener('click', () => {
            document.querySelectorAll('.resp').forEach(x => x.classList.remove('on'));
            b.classList.add('on');
            pick = b.dataset.r;
            chk();
        });
    });

    const nm = document.getElementById('name');
    nm.addEventListener('input', chk);
    function chk() { document.getElementById('sendBtn').disabled = !(nm.value.trim() && pick); }

    document.getElementById('form').addEventListener('submit', e => {
        e.preventDefault();
        if (!nm.value.trim() || !pick) return;

        const all = JSON.parse(localStorage.getItem(KEY)||'[]');
        all.push({ name: nm.value.trim(), response: pick, message: document.getElementById('msg').value.trim(), time: new Date().toISOString() });
        localStorage.setItem(KEY, JSON.stringify(all));

        e.target.classList.add('off');
        const d = document.getElementById('done');
        d.classList.add('show');

        const icons = { yes:'🎉', maybe:'🤞', no:'😢' };
        const titles = { yes:'Ne vedem acolo!', maybe:'Sperăm să vii!', no:'Păcat...' };
        const texts = { yes:'Pregătește-ți costumul! 🧡', maybe:'Dă-ne de veste când te decizi 🧡', no:'Poate altă dată! 🧡' };

        document.getElementById('doneIcon').textContent = icons[pick];
        document.getElementById('doneTitle').textContent = titles[pick];
        document.getElementById('doneTitle').style.color = pick==='yes'?'#4ade80':pick==='maybe'?'#fbbf24':'#f87171';
        document.getElementById('doneText').textContent = texts[pick];

        render();
    });

    function render() {
        const all = JSON.parse(localStorage.getItem(KEY)||'[]');
        const list = document.getElementById('gList');
        const empty = document.getElementById('gE');

        if (!all.length) { empty.style.display=''; return; }
        empty.style.display='none';
        list.querySelectorAll('.gi').forEach(x=>x.remove());

        const lab = { yes:'vine 🎉', maybe:'poate 🤔', no:'nu poate 😢' };
        all.forEach(g => {
            const d = document.createElement('div');
            d.classList.add('gi');
            d.innerHTML = `<span>${esc(g.name)}</span><span class="gb ${g.response}">${lab[g.response]}</span>`;
            list.appendChild(d);
        });
    }

    function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
    render();
</script>
</body>
</html>
