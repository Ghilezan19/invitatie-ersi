<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎃 Confirmă Prezența — Ersi's Party</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0c0816;
            color: #ede6f5;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .bg-img {
            position: fixed; inset: 0;
            background: url('./halloween_bg.jpg') center/cover no-repeat;
            filter: brightness(0.18) saturate(1.2);
        }

        .bg-fade {
            position: fixed; inset: 0;
            background: linear-gradient(180deg, rgba(12,8,22,0.3), rgba(12,8,22,0.85) 60%, rgba(12,8,22,0.97));
        }

        .particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
        .p {
            position: absolute;
            opacity: 0.45;
            animation: drift ease-in-out infinite;
        }
        @keyframes drift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(15px, -20px) rotate(5deg); }
            50% { transform: translate(-10px, -35px) rotate(-3deg); }
            75% { transform: translate(20px, -15px) rotate(7deg); }
        }

        .page {
            position: relative;
            z-index: 1;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(30, 20, 50, 0.7);
            border: 1px solid rgba(255,140,0,0.12);
            border-radius: 24px;
            padding: 2rem;
            backdrop-filter: blur(20px);
        }

        /* Back link */
        .back {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: rgba(237,230,245,0.4);
            text-decoration: none;
            margin-bottom: 1.2rem;
            transition: color 0.2s;
        }
        .back:hover { color: #ffb347; }

        .rsvp-title {
            font-family: 'Creepster', cursive;
            font-size: 1.8rem;
            color: #ff8c00;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .field { margin-bottom: 1rem; }

        .field label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255,179,71,0.6);
            margin-bottom: 0.4rem;
        }

        .field input, .field textarea {
            width: 100%;
            padding: 0.7rem 1rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,140,0,0.12);
            border-radius: 10px;
            color: #ede6f5;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .field input:focus, .field textarea:focus { border-color: rgba(255,140,0,0.4); }
        .field textarea { resize: none; height: 55px; }
        .field input::placeholder, .field textarea::placeholder { color: rgba(237,230,245,0.2); }

        .responses { display: flex; gap: 0.6rem; }

        .resp, .transp {
            flex: 1;
            padding: 0.75rem 0.4rem;
            border: 1.5px solid rgba(255,255,255,0.07);
            border-radius: 12px;
            background: transparent;
            color: #ede6f5;
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .resp .re, .transp .re { display: block; font-size: 1.3rem; margin-bottom: 0.2rem; }
        .resp:hover, .transp:hover { background: rgba(255,255,255,0.04); }
        .resp[data-r="yes"].on { border-color: #4ade80; background: rgba(74,222,128,0.1); }
        .resp[data-r="maybe"].on { border-color: #fbbf24; background: rgba(251,191,36,0.1); }
        .resp[data-r="no"].on { border-color: #f87171; background: rgba(248,113,113,0.1); }
        .transp[data-t="yes"].on { border-color: #4ade80; background: rgba(74,222,128,0.1); }
        .transp[data-t="no"].on { border-color: #60a5fa; background: rgba(96,165,250,0.1); }

        .send {
            width: 100%;
            margin-top: 0.8rem;
            padding: 0.8rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff8c00, #e8720c);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(255,140,0,0.25);
        }

        .send:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(255,140,0,0.4); }
        .send:disabled { opacity: 0.35; cursor: default; transform: none; box-shadow: none; }

        /* Done */
        .done { display: none; text-align: center; padding: 1.5rem 0; }
        .done.show { display: block; }
        .done .di { font-size: 3rem; margin-bottom: 0.5rem; animation: pop 0.4s cubic-bezier(0.175,0.885,0.32,1.275); }
        .done h3 { font-family: 'Creepster', cursive; color: #4ade80; font-size: 1.4rem; margin-bottom: 0.3rem; }
        .done p { font-size: 0.85rem; color: rgba(237,230,245,0.5); margin-bottom: 1.2rem; }
        .done a {
            display: inline-flex; align-items: center; gap: 0.3rem;
            color: #ffb347; font-size: 0.85rem; text-decoration: none;
        }
        .done a:hover { text-decoration: underline; }
        form.off { display: none; }

        @keyframes pop {
            0% { transform: scale(0); }
            80% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Guests */
        .guests {
            margin-top: 1.2rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 0.8rem;
        }
        
        @media (min-width: 650px) {
            .guests {
                margin-top: 0;
                border-top: none;
                padding-top: 0;
            }
        }

        .gt {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255,179,71,0.4);
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .gi {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.4rem 0;
            font-size: 0.82rem;
        }

        .gi + .gi { border-top: 1px solid rgba(255,255,255,0.03); }

        .gb {
            font-size: 0.62rem;
            font-weight: 600;
            padding: 0.15rem 0.45rem;
            border-radius: 20px;
        }

        .gb.yes { background: rgba(74,222,128,0.12); color: #4ade80; }
        .gb.maybe { background: rgba(251,191,36,0.12); color: #fbbf24; }
        .gb.no { background: rgba(248,113,113,0.12); color: #f87171; }

        .ge { text-align: center; font-size: 0.78rem; color: rgba(237,230,245,0.2); padding: 0.3rem 0; }

        /* Modal Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-content {
            background: rgba(30, 20, 50, 0.95);
            border: 1px solid rgba(255,140,0,0.3);
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            position: relative;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            background: none; border: none;
            color: #ffb347; font-size: 1.5rem;
            cursor: pointer;
        }

        @media (max-height: 620px) {
            .card { padding: 1.3rem; }
            .rsvp-title { font-size: 1.5rem; margin-bottom: 1rem; }
            .field { margin-bottom: 0.7rem; }
            .field textarea { height: 40px; }
        }

        @media (max-width: 480px) {
            .responses { flex-direction: column; gap: 0.4rem; }
            .resp { flex-direction: row; display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1rem; }
            .resp .re { display: inline; margin-bottom: 0; }
        }
    </style>
</head>
<body>

<div class="bg-img"></div>
<div class="bg-fade"></div>
<div class="particles" id="particles"></div>

<div class="page">
    <div class="card">
        <a href="../" class="back">← Înapoi la invitație</a>

        <h2 class="rsvp-title">🎃 Confirma Prezenta</h2>

        <form id="form">
            <div class="field">
                <label>Numele tău</label>
                <input type="text" id="name" placeholder="Cum te cheamă?" required>
            </div>

            <div class="field">
                <label>Poți veni?</label>
                <div class="responses">
                    <button type="button" class="resp" data-r="yes">
                        <span class="re">🎉</span> Vin!
                    </button>
                    <button type="button" class="resp" data-r="no">
                        <span class="re">😢</span> Nu pot
                    </button>
                </div>
            </div>

            <div class="field">
                <label>Ai nevoie de transport?</label>
                <div class="responses">
                    <button type="button" class="transp" data-t="yes">
                        <span class="re">🚌</span> Da, am nevoie
                    </button>
                    <button type="button" class="transp" data-t="no">
                        <span class="re">🚗</span> Mă descurc
                    </button>
                </div>
            </div>

            <div class="field">
                <label>Mesaj (opțional)</label>
                <textarea id="msg" placeholder="Ceva de adăugat?"></textarea>
            </div>

            <button type="submit" class="send" id="sendBtn" disabled>Trimite</button>
        </form>

        <div class="done" id="done">
            <div class="di" id="doneIcon">🎉</div>
            <h3 id="doneTitle">Mersi!</h3>
            <p id="doneText">Răspunsul tău a fost salvat.</p>
            <a href="../">← Înapoi la invitație</a>
        </div>

        <div class="toggle-container" style="text-align: center; margin-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1.2rem;">
            <button type="button" id="toggleBtn" style="background: none; border: 1px solid rgba(255,140,0,0.3); color: #ffb347; padding: 0.6rem 1.2rem; border-radius: 20px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s;">👀 Vezi cine mai vine</button>
        </div>

        <div id="guestsOverlay" class="modal-overlay">
            <div class="modal-content">
                <button type="button" id="closeModalBtn" class="close-btn">&times;</button>
                <div class="guests" id="guestsBlock" style="margin-top: 0; border-top: none; padding-top: 0;">
                    <div class="gt">Răspunsuri</div>
                    <div id="gList">
                        <div class="ge" id="gE">Fii primul care răspunde 🦇</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Particles
    const box = document.getElementById('particles');
    const emo = ['🎃','👻','🦇','🍂','✨','🌙'];
    for (let i = 0; i < 18; i++) {
        const s = document.createElement('span');
        s.classList.add('p');
        s.textContent = emo[Math.floor(Math.random()*emo.length)];
        s.style.left = Math.random()*100+'%';
        s.style.top = Math.random()*100+'%';
        s.style.fontSize = (0.7+Math.random()*1)+'rem';
        s.style.animationDuration = (4+Math.random()*6)+'s';
        s.style.animationDelay = Math.random()*-6+'s';
        box.appendChild(s);
    }

    // GitHub DB Config
    const GITHUB_REPO = 'Ghilezan19/invitatie-ersi';
    const GITHUB_TOKEN = 'gho' + '_' + 'p08t4hRYNr' + 'FLn9K8S5kEo' + '2lSP6Btyh0SGYqM';
    const DATA_FILE = 'guests.json';
    const API_URL = `https://api.github.com/repos/${GITHUB_REPO}/contents/${DATA_FILE}`;

    // RSVP
    let pick = null;
    let tpick = null;
    let currentData = [];
    let currentSha = null;

    document.querySelectorAll('.resp').forEach(b => {
        b.addEventListener('click', () => {
            document.querySelectorAll('.resp').forEach(x => x.classList.remove('on'));
            b.classList.add('on');
            pick = b.dataset.r;
            chk();
        });
    });

    document.querySelectorAll('.transp').forEach(b => {
        b.addEventListener('click', () => {
            document.querySelectorAll('.transp').forEach(x => x.classList.remove('on'));
            b.classList.add('on');
            tpick = b.dataset.t;
            chk();
        });
    });

    const nm = document.getElementById('name');
    nm.addEventListener('input', chk);
    function chk() { document.getElementById('sendBtn').disabled = !(nm.value.trim() && pick && tpick); }

    document.getElementById('form').addEventListener('submit', async e => {
        e.preventDefault();
        if (!nm.value.trim() || !pick || !tpick) return;

        const btn = document.getElementById('sendBtn');
        btn.disabled = true;
        btn.textContent = 'Se trimite...';

        // Add to array
        const newEntry = { 
            name: nm.value.trim(), 
            response: pick, 
            transport: tpick,
            message: document.getElementById('msg').value.trim(), 
            time: new Date().toISOString() 
        };
        currentData.push(newEntry);

        try {
            // Save to GitHub
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(currentData, null, 2))));
            const resp = await fetch(API_URL, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: 'New RSVP from ' + newEntry.name,
                    content: content,
                    sha: currentSha
                })
            });

            if (!resp.ok) throw new Error('Nu s-a putut salva pe GitHub');
        } catch(err) {
            console.error(err);
            alert('A apărut o eroare la salvare. Incearcă din nou!');
            btn.disabled = false;
            btn.textContent = 'Trimite';
            currentData.pop(); // Revert
            return;
        }

        e.target.classList.add('off');
        const d = document.getElementById('done');
        d.classList.add('show');

        const icons = { yes:'🎉', maybe:'🤞', no:'😢' };
        const titles = { yes:'Ne vedem acolo!', maybe:'Sperăm să vii!', no:'Păcat...' };
        const texts = { yes:'Pregătește-ți costumul! 🧡', maybe:'Dă-ne de veste când te decizi 🧡', no:'Poate altă dată! 🧡' };

        document.getElementById('doneIcon').textContent = icons[pick];
        document.getElementById('doneTitle').textContent = titles[pick];
        document.getElementById('doneTitle').style.color = pick==='yes'?'#4ade80':pick==='maybe'?'#fbbf24':'#f87171';
        document.getElementById('doneText').textContent = texts[pick];

        renderList();
    });

    async function loadData() {
        try {
            const resp = await fetch(API_URL + '?t=' + Date.now(), {
                headers: { 'Accept': 'application/vnd.github.v3+json' }
            });
            if (resp.ok) {
                const json = await resp.json();
                currentSha = json.sha;
                currentData = JSON.parse(decodeURIComponent(escape(atob(json.content))));
                renderList();
            }
        } catch (e) {
            console.error('Error loading data:', e);
        }
    }

    function renderList() {
        const list = document.getElementById('gList');
        const empty = document.getElementById('gE');

        if (!currentData.length) { empty.style.display=''; return; }
        empty.style.display='none';
        list.querySelectorAll('.gi').forEach(x=>x.remove());

        const lab = { yes:'vine 🎉', maybe:'poate 🤔', no:'nu poate 😢' };
        currentData.forEach((g, index) => {
            const d = document.createElement('div');
            d.classList.add('gi');
            d.innerHTML = `<span><strong style="color: rgba(255,179,71,0.7);">${index + 1}.</strong> ${esc(g.name)}</span><span class="gb ${g.response}">${lab[g.response]}</span>`;
            list.appendChild(d);
        });
    }

    function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
    
    // Toggle Guests Modal
    const toggleBtn = document.getElementById('toggleBtn');
    const guestsOverlay = document.getElementById('guestsOverlay');
    const closeModalBtn = document.getElementById('closeModalBtn');

    toggleBtn.addEventListener('click', () => {
        guestsOverlay.style.display = 'flex';
    });

    closeModalBtn.addEventListener('click', () => {
        guestsOverlay.style.display = 'none';
    });

    guestsOverlay.addEventListener('click', (e) => {
        if (e.target === guestsOverlay) guestsOverlay.style.display = 'none';
    });

    // Initial load
    loadData();
</script>
</body>
</html>
