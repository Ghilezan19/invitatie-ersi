<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎃 Ersi's Halloween Birthday</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0c0816;
            color: #ede6f5;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .bg-img {
            position: fixed; inset: 0;
            background: url('./halloween_bg.jpg') center/cover no-repeat;
            filter: brightness(0.22) saturate(1.2);
        }

        .bg-fade {
            position: fixed; inset: 0;
            background: linear-gradient(180deg, rgba(12,8,22,0.2), rgba(12,8,22,0.75) 70%, rgba(12,8,22,0.95));
        }

        .particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
        .p {
            position: absolute;
            opacity: 0.45;
            animation: drift ease-in-out infinite;
        }
        @keyframes drift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(15px, -20px) rotate(5deg); }
            50% { transform: translate(-10px, -35px) rotate(-3deg); }
            75% { transform: translate(20px, -15px) rotate(7deg); }
        }

        .page {
            position: relative;
            z-index: 1;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(30, 20, 50, 0.7);
            border: 1px solid rgba(255,140,0,0.12);
            border-radius: 24px;
            padding: 2.2rem 2rem;
            backdrop-filter: blur(20px);
            text-align: center;
        }

        .emoji { font-size: 2.5rem; margin-bottom: 0.6rem; }

        .title {
            font-family: 'Creepster', cursive;
            font-size: clamp(2.2rem, 7vw, 3rem);
            background: linear-gradient(135deg, #ff8c00, #ffd700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.1;
        }

        .sub {
            font-size: 0.9rem;
            color: rgba(237,230,245,0.5);
            margin-top: 0.3rem;
        }

        .name {
            font-family: 'Creepster', cursive;
            font-size: clamp(1.6rem, 5vw, 2.2rem);
            color: #ffd700;
            margin-top: 0.1rem;
        }

        .line {
            width: 50px;
            height: 1px;
            background: rgba(255,140,0,0.25);
            margin: 1.2rem auto;
        }

        .details { display: flex; flex-direction: column; gap: 0.6rem; }

        .row {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.55rem 0.9rem;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 500;
            text-align: left;
        }

        .row .ic { font-size: 1.15rem; flex-shrink: 0; }
        .row strong { color: #ffb347; }

        .tag {
            margin-top: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.9rem;
            background: rgba(255,140,0,0.07);
            border: 1px solid rgba(255,140,0,0.18);
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #ffb347;
        }

        .cta {
            display: block;
            width: 100%;
            margin-top: 1.4rem;
            padding: 0.85rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff8c00, #e8720c);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(255,140,0,0.25);
        }

        .cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(255,140,0,0.4);
        }

        @media (max-height: 650px) {
            .card { padding: 1.5rem 1.3rem; }
            .emoji { font-size: 2rem; margin-bottom: 0.3rem; }
            .line { margin: 0.8rem auto; }
            .row { padding: 0.4rem 0.8rem; font-size: 0.82rem; }
            .cta { margin-top: 1rem; }
        }
    </style>
</head>
<body>

<div class="bg-img"></div>
<div class="bg-fade"></div>
<div class="particles" id="particles"></div>

<div class="page">
    <div class="card">
        <div class="emoji">🎃</div>
        <h1 class="title">Halloween Party</h1>
        <p class="sub">La petrecerea de ziua lui</p>
        <h2 class="name">ERSI</h2>

        <div class="line"></div>

        <div class="details">
            <div class="row">
                <span class="ic">📅</span>
                <span><strong>6 – 8 Noiembrie 2026</strong></span>
            </div>
            <div class="row">
                <span class="ic">⏰</span>
                <span>De la ora <strong>18:00</strong></span>
            </div>
            <div class="row">
                <span class="ic">📍</span>
                <span><strong>Pensiunea Casa Montana</strong>, Sasca Montană</span>
            </div>
        </div>

        <span class="tag">🎭 Dress code: costum de Halloween</span>

        <a href="confirma" class="cta">🎃 Confirmă Prezența</a>
    </div>
</div>

<script>
    const box = document.getElementById('particles');
    const emo = ['🎃','👻','🦇','🍂','✨','🌙'];
    for (let i = 0; i < 18; i++) {
        const s = document.createElement('span');
        s.classList.add('p');
        s.textContent = emo[Math.floor(Math.random()*emo.length)];
        s.style.left = Math.random()*100+'%';
        s.style.top = Math.random()*100+'%';
        s.style.fontSize = (0.7+Math.random()*1)+'rem';
        s.style.animationDuration = (4+Math.random()*6)+'s';
        s.style.animationDelay = Math.random()*-6+'s';
        box.appendChild(s);
    }
</script>
</body>
</html>
